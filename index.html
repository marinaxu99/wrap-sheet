<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WrapSheet">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#141618">
    <meta name="description" content="Invoices and expense receipts for film crew.">
    <title>WrapSheet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./vendor/html2pdf.bundle.min.js"></script>
    <script type="module" src="./app.js"></script>
</head>

<body>
    <div id="hud-toast" class="hud-toast" role="status" aria-live="polite">
        <span class="hud-dot"></span>
        <span id="hud-toast-text" class="hud-text"></span>
    </div>

    <header class="topbar">
        <a class="brand" href="#details">
            <img class="brand-icon" src="./icon.svg" alt="" width="24" height="24">
            WrapSheet
        </a>
        <div class="invoice-switcher">
            <select id="project-picker" aria-label="Open invoice"></select>
            <button id="new-project" title="Start a new invoice">New invoice</button>
            <button id="delete-project" class="danger-quiet" title="Delete the open invoice">Delete</button>
            <span id="save-status" role="status">Saved</span>
        </div>
        <div class="top-actions">
            <button id="profile-button" class="quiet">Profile</button>
            <button id="settings-button" class="quiet">Settings</button>
        </div>
    </header>

    <main>
        <nav class="steps" aria-label="Invoice steps">
            <button data-tab="details"><span>1</span> Details</button>
            <button data-tab="work"><span>2</span> Work</button>
            <button data-tab="receipts"><span>3</span> Receipts</button>
            <button data-tab="invoice"><span>4</span> Invoice</button>
        </nav>

        <div class="workspace">
            <section id="view" aria-live="polite"></section>

            <aside class="summary">
                <div class="eyebrow" id="summary-format">Format</div>
                <h2 id="summary-name">Untitled invoice</h2>
                <div class="rule"></div>
                <div class="sum-row"><span>Work</span><strong id="labor-total">₩0</strong></div>
                <div class="sum-row"><span id="expense-label">Expenses</span><strong id="expense-total">₩0</strong></div>
                <div class="sum-row"><span id="tax-label">VAT</span><strong id="tax-total">₩0</strong></div>
                <div class="total">
                    <span>Total due</span>
                    <strong id="grand-total">₩0</strong>
                </div>
                <div id="receipt-status-pill" class="status-indicator-pill" hidden></div>
                <button id="primary-action-btn" class="primary wide">Next</button>
            </aside>
        </div>
    </main>

    <dialog id="receipt-inspect-modal">
        <div class="inspect-header">
            <div class="inspect-nav-controls">
                <button type="button" id="inspect-prev-btn" class="action-btn inspect-nav-btn" title="Previous (left arrow)">← Previous</button>
                <span id="inspect-counter">1 of 1</span>
                <button type="button" id="inspect-next-btn" class="action-btn inspect-nav-btn" title="Next (right arrow)">Next →</button>
            </div>
            <button type="button" id="close-inspect-modal" class="primary">Done</button>
        </div>
        <div class="inspect-body" id="inspect-swipe-area">
            <div class="inspect-img-pane">
                <img id="inspect-img-target" src="" alt="Receipt">
            </div>
            <div class="inspect-form-pane" id="inspect-form-target"></div>
        </div>
    </dialog>

    <dialog id="preview-modal">
        <div class="zoom-modal-header">
            <span>Invoice preview</span>
            <button type="button" id="close-preview-modal" class="primary">Close</button>
        </div>
        <div class="zoom-modal-body">
            <div id="preview-modal-content"></div>
        </div>
    </dialog>

    <dialog id="settings" class="wide-dialog">
        <div id="settings-body"></div>
    </dialog>

    <dialog id="profile-dialog" class="wide-dialog">
        <form id="profile-form"></form>
    </dialog>

    <dialog id="new-dialog">
        <div id="new-body"></div>
    </dialog>

    <dialog id="format-dialog" class="wide-dialog">
        <form id="format-form"></form>
    </dialog>
</body>

</html>
